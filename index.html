<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://kfgswynickhywzhneltu.supabase.co https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Teshrij Desk</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/desk.css">
  <script src="js/config.js"></script>
</head>
<body>
  <!-- Sign in with a personal access token -->
  <div id="login" class="screen-center" hidden>
    <form id="loginForm" class="login-card" autocomplete="off">
      <img src="img/logo.png" alt="" class="login-logo">
      <h1>Teshrij Desk</h1>
      <p class="muted">Paste your personal access token, or open the sign-in link your admin sent you.</p>
      <label>Access token<input id="loginToken" type="password" placeholder="dsk_…" required spellcheck="false" autocomplete="off"></label>
      <button class="btn primary block" type="submit">Sign in</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <!-- Sidebar: views + labels -->
    <aside id="sidebar" class="sidebar" aria-label="Views and labels">
      <div class="brand">
        <img src="img/logo.png" alt="">
        <div>
          <strong>Teshrij Desk</strong>
          <span id="demoBadge" class="demo-badge" hidden title="Local demo: chats are mirrored read-only from production; nothing you send leaves this computer">Demo · sends simulated</span>
        </div>
      </div>
      <nav class="nav">
        <div id="navMain"></div>
        <div class="nav-title nav-title-row">Labels <button id="manageBtn" class="icon-btn sm" title="Manage labels" aria-label="Manage labels"></button></div>
        <div id="navLabels"></div>
        <div class="nav-title">Channels</div>
        <div id="navChannels"></div>
      </nav>
      <div class="sidebar-foot">
        <button id="staffBtn" class="staff-btn" title="Change who is working"></button>
        <button id="bellBtn" class="icon-btn" title="Alerts" aria-label="Alerts"></button>
        <button id="themeBtn" class="icon-btn" title="Light / dark" aria-label="Toggle dark mode"></button>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <!-- Conversation list -->
    <section class="list-pane" aria-label="Chats">
      <header class="list-head">
        <button id="menuBtn" class="icon-btn only-narrow" aria-label="Views and labels"></button>
        <h2 id="viewTitle">Unresolved</h2>
        <span id="viewCount" class="count-pill"></span>
        <button id="helpBtn" class="icon-btn help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"></button>
      </header>
      <div class="list-tools">
        <label class="search">
          <span class="search-ic" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="Search name, number or message   ( / )" autocomplete="off">
        </label>
        <div id="ctxBar" class="ctx-bar" role="status" aria-live="polite"></div>
      </div>
      <ul id="list" class="list" aria-live="polite"></ul>
    </section>

    <!-- Chat -->
    <section id="chat" class="chat-pane empty" aria-label="Conversation">
      <div class="chat-empty"></div>
    </section>

    <!-- Details -->
    <aside id="details" class="details-pane" aria-label="Contact details" hidden></aside>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
